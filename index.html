<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#12485c" />
  <title>云境 · 长风入谷</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E云%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" />
  <link rel="stylesheet" href="/src/ui/welcome.css" />
</head>
<body>
  <div id="app" inert></div>
  <section class="welcome" id="welcome" data-state="loading" aria-labelledby="welcome-title">
    <img class="welcome-art" src="/assets/yunjing-welcome.jpg" alt="" fetchpriority="high" />
    <h1 id="welcome-title">
      <img src="/src/ui/assets/launch-ui/yunjing-title.svg" width="610" height="260" alt="云境 · 长风入谷" draggable="false" />
    </h1>
    <div class="welcome-entry">
      <button type="button" id="start" class="welcome-start" aria-label="启程" disabled hidden>
        <img src="/src/ui/assets/launch-ui/start-button.svg" width="380" height="86" alt="" draggable="false" />
      </button>
      <div class="welcome-loading">
        <div class="welcome-track">
          <progress id="welcome-progress" value="0" max="8" aria-label="场景加载进度"></progress>
          <svg class="welcome-bar-svg" viewBox="0 0 758 56" fill="none" aria-hidden="true">
            <defs>
              <linearGradient id="welcome-load-metal" gradientUnits="userSpaceOnUse" x1="33" y1="23" x2="738" y2="44">
                <stop stop-color="#DCBB80"/><stop offset=".14" stop-color="#FAE6BA"/><stop offset=".57" stop-color="#CCA977"/><stop offset=".88" stop-color="#F8E5BF"/><stop offset="1" stop-color="#E4BB7A"/>
              </linearGradient>
              <linearGradient id="welcome-load-fill" gradientUnits="userSpaceOnUse" x1="45" y1="43" x2="723" y2="31">
                <stop stop-color="#64DFFD"/><stop offset=".33" stop-color="#28B9E9"/><stop offset=".74" stop-color="#4CB8FC"/><stop offset="1" stop-color="#C1FBFF"/>
              </linearGradient>
              <linearGradient id="welcome-load-reflect" x2="0" y2="1">
                <stop stop-color="#CCFCFF" stop-opacity=".9"/><stop offset=".39" stop-color="#9AF5FF" stop-opacity=".38"/><stop offset="1" stop-color="#1B8FF9" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="welcome-load-tail" gradientUnits="userSpaceOnUse" x1="553" y1="40" x2="671" y2="14">
                <stop stop-color="#63DEFF" stop-opacity="0"/><stop offset=".57" stop-color="#D3FCFF"/><stop offset=".8" stop-color="#9CF8FF"/><stop offset="1" stop-color="#72E4FF" stop-opacity=".25"/>
              </linearGradient>
              <radialGradient id="welcome-load-glow">
                <stop stop-color="#A0F6FF" stop-opacity=".85"/><stop offset=".38" stop-color="#4CDFFF" stop-opacity=".37"/><stop offset="1" stop-color="#1AA8F5" stop-opacity="0"/>
              </radialGradient>
              <clipPath id="welcome-track-inner">
                <path d="M45 28.5h667c6 0 11 2 14 5.5-3 3.5-8 5.5-14 5.5H45c-6 0-10-2-14-5.5 4-3.5 8-5.5 14-5.5Z"/>
              </clipPath>
            </defs>
            <g id="progress-track">
              <path d="M42 24h672c8 0 15 3 20 10-5 6-12 10-20 10H42c-8 0-15-4-21-10 6-7 13-10 21-10Z" fill="#071F29" fill-opacity=".69" stroke="#152A30" stroke-width="4"/>
              <path d="M43 25h670c8 0 14 3 19 9-5 6-11 9-19 9H43c-7 0-13-3-18-9 5-6 11-9 18-9Z" stroke="url(#welcome-load-metal)" stroke-width="2.2"/>
              <path d="M45 28h667c6 0 11 2 14 6-3 4-8 6-14 6H45c-6 0-10-2-14-6 4-4 8-6 14-6Z" stroke="#F6DDB4" stroke-opacity=".80" stroke-width="1"/>
              <path d="M1 34h14m0 0 7-5 7 5-7 5-7-5ZM728 34l7-5 7 5-7 5-7-5Zm14 0h15m-738 0 3-2 3 2-3 2zM732 34l3-2 3 2-3 2z" stroke="url(#welcome-load-metal)" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <g clip-path="url(#welcome-track-inner)">
              <g class="welcome-fill-bar">
                <rect x="31" y="28.8" width="696" height="10.5" rx="5.25" fill="url(#welcome-load-fill)"/>
                <rect x="32" y="28.8" width="694" height="8" rx="4" fill="url(#welcome-load-reflect)"/>
                <path d="M39 31h678" stroke="#D8FCFF" stroke-opacity=".72" stroke-width="1" stroke-linecap="round"/>
                <path d="M35 37h674" stroke="#49ECFF" stroke-opacity=".45" stroke-width="1" stroke-linecap="round"/>
              </g>
            </g>
            <g class="welcome-light-tip">
              <g transform="translate(-641 0)">
                <ellipse cx="628" cy="27" rx="72" ry="27" fill="url(#welcome-load-glow)"/>
                <path d="M552 29c22 2 41 12 62 6 10-3 17-10 22-17 7-9 17-14 32-13-13 2-20 6-22 13 2 2 6 1 9 0-6 7-13 14-23 18-26 12-48 4-65-1l-15-6Z" fill="url(#welcome-load-tail)"/>
                <path d="M559 30c19 3 38 13 58 6 11-4 17-11 23-19 6-8 16-12 27-12-10 2-17 5-20 10-4 7-14 18-26 22-22 9-44-1-62-7Z" fill="#DDFDFF"/>
                <path d="M576 42c29 9 57 5 71-10m-9-16c8-10 21-14 35-10m-97 39c28 3 65-1 82-17" stroke="#80E7FF" stroke-opacity=".55" stroke-width="1.05" stroke-linecap="round"/>
              </g>
            </g>
          </svg>
        </div>
        <div class="welcome-meta">
          <span class="welcome-status-wrap">
            <svg class="welcome-spinner" viewBox="47 50 30 30" fill="none" aria-hidden="true">
              <path d="M67 55a11.5 11.5 0 1 1-10 17" stroke="#FAE6BD" stroke-width="2.25" stroke-linecap="round" stroke-dasharray="12 5 6 5"/>
              <path d="M56 62a11.5 11.5 0 0 1 6-5" stroke="#EBCD96" stroke-opacity=".71" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span id="welcome-status" role="status">正在初始化场景…</span>
          </span>
          <span id="welcome-percent" aria-hidden="true">0%</span>
        </div>
      </div>
    </div>
  </section>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
